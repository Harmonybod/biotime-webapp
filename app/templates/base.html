<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BioTime Web App{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/leaves">BioTime Web App</a>
    <nav>
      <a href="/leaves">Leave Requests</a>
      <a href="/leaves/new">New Request</a>
      <a href="/punches">Manual Punch</a>
      <a href="/reports/worked-hours">Worked Hours</a>
      <a href="/reports/absence">Absence</a>
      <a href="/reports/late-arrivals">Late Arrivals</a>
      <a href="/integrations">API Integrations</a>
    </nav>
    <a class="topbar-settings" href="/setup">BioTime Connection</a>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="app-footer">BioTime Web App v{{ app_version }}</footer>
</body>
</html>
